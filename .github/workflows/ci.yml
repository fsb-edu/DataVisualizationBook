name: deploy-book

on:
  push:
    branches:
    - main

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.6.13"
        python-version: "3.10"

    - name: Install dependencies
      run: uv sync --locked --no-dev

    - name: Build the book
      run: uv run --locked --no-dev jupyter-book build --all .

    - name: Check notebook execution
      run: |
        if find _build/html/reports -name '*.log' -print -quit 2>/dev/null | grep -q .; then
          find _build/html/reports -name '*.log' -print
          exit 1
        fi

    - name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_build/html
        publish_branch: book
        enable_jekyll: false
