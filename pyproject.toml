[project]
name = "data-visualization-for-food-scientists"
version = "0.1.0"
description = "Jupyter Book for teaching data visualization to Food Scientists"
authors = [
    { name = "Michal Ziemski", email = "mziemski@ethz.ch" },
    { name = "Doriela Grabocka", email = "dgrabocka@student.ethz.ch" },
    { name = "Nicholas Bokulich", email = "nicholas.bokulich@hest.ethz.ch" },
]
readme = "README.md"
requires-python = ">=3.9,<3.11"
dependencies = [
    "jupyter-book==0.13.1",
    "matplotlib==3.7.1",
    "numpy<=1.24",
    "pandas<2",
    "plotly==5.9.0",
    "seaborn==0.12.1",
    "umap-learn==0.5.3",
    "numba==0.56.3",
    "setuptools==67.8.0",
]

[dependency-groups]
dev = ["jupyterlab"]

[tool.uv]
package = false
constraint-dependencies = [
    "gitpython==3.1.59",
    "lxml==4.9.2",
    "sphinxcontrib-applehelp==1.0.4",
    "sphinxcontrib-devhelp==1.0.2",
    "sphinxcontrib-htmlhelp==2.0.1",
    "sphinxcontrib-qthelp==1.0.3",
    "sphinxcontrib-serializinghtml==1.1.5",
]
